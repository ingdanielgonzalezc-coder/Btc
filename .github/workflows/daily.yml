name: BTC paper trading — daily

on:
  schedule:
    - cron: "30 0 * * *"     # 00:30 UTC, después de que cierra la vela diaria (00:00 UTC)
  workflow_dispatch:          # permite gatillarlo a mano desde la pestaña "Actions"

permissions:
  contents: read

# Evita que dos corridas se pisen (p.ej. el cron y un dispatch manual a la vez)
concurrency:
  group: btc-paper-daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      # Bloquea la escritura al Sheet si algo se rompió. Incluye el test de
      # equivalencia de señal contra el registro archivado de v2.0.
      - name: Tests
        run: pytest -q

      # v2.0 — motor congelado, sigue corriendo en su pestaña para comparación.
      # continue-on-error: un fallo del legado NO puede impedir que v2.1 escriba.
      - name: Correr v2.0 (legado)
        continue-on-error: true
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: python daily_run.py

      # v2.1 — registro oficial. Si falla, la corrida falla y llega el email.
      - name: Correr v2.1
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GITHUB_SHA: ${{ github.sha }}
        run: python daily_run_v21.py
