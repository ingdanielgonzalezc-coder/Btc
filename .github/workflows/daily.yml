name: BTC paper trading — daily

on:
  schedule:
    - cron: "30 0 * * *"     # 00:30 UTC, después de que cierra la vela diaria (00:00 UTC)
  workflow_dispatch:          # permite gatillarlo a mano desde la pestaña "Actions"

permissions:
  contents: read

# Evita que dos corridas se pisen (p.ej. el cron y un dispatch manual a la vez)
concurrency:
  group: btc-paper-daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Volcar snapshot de precios (TEMPORAL)
        run: |
          python - <<'PY'
          import daily_run as v20
          px = v20.fetch_prices()
          px.to_csv("prices_snapshot.csv", header=["btc_price"])
          print(f"{len(px)} filas: {px.index.min().date()} -> {px.index.max().date()}")
          PY

      - name: Subir snapshot como artifact (TEMPORAL)
        uses: actions/upload-artifact@v4
        with:
          name: prices-snapshot
          path: prices_snapshot.csv

      - name: Tests
        run: pytest -q
        
      - name: Correr cómputo diario
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: python daily_run.py
